name: Security

on:
  push:
    branches: [main, 3.x, 2.x]
  pull_request:
    branches: [main, 3.x, 2.x]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  composer-audit:
    name: composer audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, openssl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run composer audit
        run: composer audit --no-dev --locked || composer audit
